name: Build and Publish EXE

# يعمل على المستودع العام: دقائق Actions مجانية بلا حد.
# يجلب الشيفرة من المستودع الخاص Restaurant-src ثم ينشر المُثبِّت هنا فقط.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "الوسم أو الفرع في Restaurant-src (مثال: v1.0.53)"
        required: true
        default: "main"
  repository_dispatch:
    types: [build-release]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: alaaelmorsy/Restaurant-src
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false

      - name: Get version from package.json
        id: pkg
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build installers
        run: npm run dist:win:all -- --publish never

      - name: Publish release (installers only)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "الإصدار ${{ steps.pkg.outputs.VERSION }}"
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            ./dist/Restaurant-Setup-${{ steps.pkg.outputs.VERSION }}.exe
            ./dist/Restaurant-Setup-${{ steps.pkg.outputs.VERSION }}.exe.blockmap
            ./dist/Restaurant-Setup-${{ steps.pkg.outputs.VERSION }}.msi
            ./dist/latest.yml
